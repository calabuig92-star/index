<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cuánto cuesta tu reforma? — Calculadora Reforma</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

:root{
  --bg:#EFE9DD;
  --card:#FBF8F2;
  --card-alt:#E8E0CE;
  --ink:#332F28;
  --ink-soft:#756C5E;
  --ink-faint:#A79E8E;
  --sage:#7C8B6C;
  --sage-deep:#5F6E51;
  --sage-soft:#DFE4D2;
  --clay:#AE6A44;
  --clay-soft:#EAD7C6;
  --line:#D9D0BE;
  --radius:18px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(124,139,108,0.07), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(174,106,68,0.07), transparent 45%);
  font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:48px 20px;
  line-height:1.5;
}

.stage{width:100%;max-width:620px;}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:40px 40px 34px;
  box-shadow:0 1px 2px rgba(51,47,40,0.04), 0 12px 32px -18px rgba(51,47,40,0.25);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg, var(--sage) 0%, var(--sage) 33%, var(--clay) 33%, var(--clay) 100%);
  opacity:0.55;
}

.eyebrow{
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--ink-faint);
  font-weight:700;
  margin-bottom:22px;
}
.eyebrow strong{color:var(--ink-soft);}

/* Stepping-stone progress */
.progress{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:30px;
  min-height:20px;
}
.stone{
  width:9px;height:9px;border-radius:50%;
  background:transparent;
  border:1.5px solid var(--ink-faint);
  transition:all .35s ease;
  flex-shrink:0;
}
.stone.done{background:var(--sage);border-color:var(--sage);}
.stone.current{
  width:22px;border-radius:6px;
  background:var(--clay);border-color:var(--clay);
}
.stone-path{
  flex:1;
  height:1px;
  background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
}

.content{min-height:280px; display:flex; flex-direction:column;}

/* Intro */
.intro-title{
  font-family:'Shippori Mincho', serif;
  font-size:30px;
  font-weight:700;
  line-height:1.35;
  margin:0 0 14px;
  color:var(--ink);
}
.intro-text{
  color:var(--ink-soft);
  font-size:15.5px;
  margin:0 0 8px;
}
.intro-list{
  margin:22px 0 28px;
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.intro-list li{
  display:flex;
  gap:12px;
  align-items:baseline;
  font-size:14.5px;
  color:var(--ink-soft);
}
.intro-list li::before{
  content:"◦";
  color:var(--sage);
  font-size:18px;
  line-height:1;
}

/* Question — Avenir Next LT Pro en negrita */
.q-title{
  font-family:'Avenir Next LT Pro', 'Avenir Next', 'Avenir', 'Helvetica Neue', Helvetica, sans-serif;
  font-style:normal;
  font-size:26px;
  font-weight:700;
  letter-spacing:-0.01em;
  margin:0 0 6px;
  line-height:1.3;
  color:var(--ink);
}
.q-subtitle{
  color:var(--ink-soft);
  font-size:14px;
  margin:0 0 24px;
}

.options{display:flex;flex-direction:column;gap:10px;}
.option{
  border:1.5px solid var(--line);
  background:var(--card);
  border-radius:12px;
  padding:14px 16px;
  cursor:pointer;
  text-align:left;
  transition:all .18s ease;
  font-family:inherit;
}
.option:hover{border-color:var(--sage);background:var(--sage-soft);}
.option.selected{border-color:var(--clay);background:var(--clay-soft);}
.option-label{font-weight:700;font-size:15px;color:var(--ink);}
.option-hint{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

.q-disclaimer{
  font-size:11.5px;
  color:var(--ink-faint);
  margin-top:14px;
  padding:10px 12px;
  border-left:2px solid var(--sage);
  background:var(--sage-soft);
  border-radius:0 8px 8px 0;
  line-height:1.5;
}

.slider-wrap{margin-top:10px;}
.slider-value{
  font-family:'Shippori Mincho', serif;
  font-size:44px;
  font-weight:700;
  color:var(--clay);
  margin-bottom:18px;
}
.slider-value span{font-size:18px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;}
input[type=range]{
  -webkit-appearance:none;
  width:100%;height:4px;
  background:var(--line);
  border-radius:4px;
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:var(--clay);
  border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--clay);
  cursor:pointer;
  margin-top:-8px;
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:var(--clay);border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--clay);cursor:pointer;
}
.slider-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);margin-top:6px;}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:26px;}
.btn{
  font-family:inherit;
  border:none;
  border-radius:999px;
  padding:12px 24px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all .18s ease;
}
.btn-primary{background:var(--ink);color:var(--card);}
.btn-primary:hover{background:var(--sage-deep);}
.btn-primary:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:12px 8px;}
.btn-ghost:hover{color:var(--ink);}

/* Calculating */
.calc-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:18px;padding:40px 0;
}
.calc-stones{display:flex;gap:10px;}
.calc-dot{width:10px;height:10px;border-radius:50%;background:var(--sage);animation:bounce 1.1s infinite ease-in-out;}
.calc-dot:nth-child(2){animation-delay:.15s;background:var(--clay);}
.calc-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-8px);opacity:1;}}
.calc-text{color:var(--ink-soft);font-size:14px;}

/* Result */
.result-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-deep);font-weight:700;margin-bottom:8px;}
.result-title{font-family:'Shippori Mincho', serif;font-size:22px;font-weight:700;margin:0 0 4px;}
.range-box{
  background:var(--card-alt);
  border-radius:14px;
  padding:24px;
  text-align:center;
  margin:18px 0 22px;
}
.range-value{font-family:'Shippori Mincho',serif;font-size:30px;font-weight:800;color:var(--ink);}
.range-caption{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

.section{margin-bottom:22px;}
.section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-faint);margin-bottom:10px;}

.phase-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.phase-row:last-child{border-bottom:none;}
.phase-name{color:var(--ink);font-weight:500;}
.phase-weeks{color:var(--sage-deep);font-weight:700;font-family:'Shippori Mincho',serif;}

.people-list{display:flex;flex-direction:column;gap:8px;}
.people-item{display:flex;gap:10px;font-size:14px;color:var(--ink-soft);align-items:flex-start;}
.people-item::before{content:"·";color:var(--clay);font-weight:900;font-size:18px;line-height:1.1;}

.note{
  font-size:12.5px;
  color:var(--ink-faint);
  background:var(--bg);
  border:1px dashed var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-top:4px;
}

.eco-box{
  font-size:13px;
  color:var(--sage-deep);
  background:var(--sage-soft);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:22px;
  line-height:1.55;
}

.cta{
  margin-top:26px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:stretch;
}
.cta-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;margin-bottom:2px;}
.cta-text{font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;}
.btn-cta{
  background:var(--clay);color:#fff;text-align:center;text-decoration:none;
  padding:14px 20px;border-radius:12px;font-weight:700;font-size:14.5px;
  display:block;
}
.btn-cta:hover{background:var(--sage-deep);}
.btn-restart{
  background:transparent;border:1px solid var(--line);color:var(--ink-soft);
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;
}
.btn-restart:hover{border-color:var(--sage);color:var(--sage-deep);}

@media (max-width:480px){
  .card{padding:28px 22px 24px;}
  .intro-title{font-size:25px;}
  .range-value{font-size:25px;}
}
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="eyebrow"><strong>DAVID LABORI ARQUITECTURA</strong> · Calculadora Reforma</div>
    <div class="progress" id="progress"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const questions = [
  {
    key:'tipo', type:'choice',
    title:'¿Qué tipo de vivienda quieres reformar?',
    subtitle:'Nos ayuda a entender el punto de partida.',
    options:[
      {value:'piso', label:'Piso o apartamento', hint:'En bloque de vecinos'},
      {value:'unifamiliar', label:'Casa unifamiliar', hint:'Aislada o adosada'},
      {value:'atico', label:'Ático o dúplex', hint:'Con particularidades propias'},
      {value:'otro', label:'Otro tipo', hint:'Local, casa rural, etc.'}
    ]
  },
  {
    key:'superficie', type:'slider',
    title:'¿Qué superficie aproximada tiene?',
    subtitle:'Un número aproximado es suficiente, no hace falta el plano.',
    min:30, max:300, step:5, def:80, unit:'m²'
  },
  {
    key:'alcance', type:'choice',
    title:'¿Qué alcance imaginas para la reforma?',
    subtitle:'Si aún no lo tienes claro, elige lo que más se acerque.',
    options:[
      {value:'integral', label:'Reforma integral', hint:'Toda la vivienda, de arriba a abajo'},
      {value:'cocinaybanos', label:'Cocina y baños', hint:'Los espacios que más se notan'},
      {value:'ampliacion', label:'Ampliación o redistribución', hint:'Cambiar tabiques o ganar espacio'},
      {value:'parcial', label:'Reforma parcial', hint:'Uno o dos espacios concretos'}
    ]
  },
  {
    key:'acabados', type:'choice',
    title:'¿Qué nivel de acabados te imaginas?',
    subtitle:'Esto influye en el precio más de lo que parece.',
    options:[
      {value:'esencial', label:'Esenciales', hint:'Cuidados y funcionales, sin extras'},
      {value:'medio', label:'Medios', hint:'Buen equilibrio calidad-precio'},
      {value:'alto', label:'Altos', hint:'Materiales premium, detalle a medida'}
    ]
  },
  {
    key:'eficiencia', type:'choice',
    title:'¿Quieres aprovechar la reforma para mejorar la eficiencia energética?',
    subtitle:'Aislamiento, ventanas, climatización eficiente, aerotermia…',
    options:[
      {value:'si', label:'Sí, es una prioridad', hint:'Quiero una casa que consuma menos'},
      {value:'interesa', label:'Me interesa, quiero saber más', hint:'Depende de lo que suponga'},
      {value:'no', label:'De momento no', hint:'Prefiero centrarme en lo demás'}
    ],
    disclaimer:'Hacer tu casa más eficiente reduce la factura energética cada mes, mejora el confort en invierno y en verano, aumenta el valor de la vivienda y puede dar acceso a ayudas y deducciones fiscales por rehabilitación energética.'
  },
  {
    key:'plazo', type:'choice',
    title:'¿Cuándo te gustaría empezar?',
    subtitle:'Esto no cambia el precio, pero sí cómo planificamos contigo.',
    options:[
      {value:'ya', label:'Ya mismo', hint:'Quiero moverme cuanto antes'},
      {value:'corto', label:'En 3–6 meses', hint:'Lo tengo bastante decidido'},
      {value:'medio_plazo', label:'En 6–12 meses', hint:'Todavía dando forma a la idea'},
      {value:'explorando', label:'Aún no lo sé', hint:'Solo quiero entender el terreno que piso'}
    ]
  }
];

// state: 0 = intro, 1..N = preguntas, 98 = calculando, 99 = resultado
let step = 0;
const answers = { superficie: 80 };

const contentEl = document.getElementById('content');
const progressEl = document.getElementById('progress');

function renderProgress(){
  if(step === 0 || step === 98){ progressEl.innerHTML = ''; return; }
  const qIndex = step - 1;
  const total = questions.length;
  let html = '';
  for(let i=0;i<total;i++){
    let cls = 'stone';
    if(step === 99 || i < qIndex) cls += ' done';
    else if(i === qIndex) cls += ' current';
    html += `<div class="${cls}"></div>`;
    if(i < total-1) html += `<div class="stone-path"></div>`;
  }
  progressEl.innerHTML = html;
}

function renderIntro(){
  contentEl.innerHTML = `
    <div class="intro-title">¿Cuánto puede costarte<br>tu reforma?</div>
    <p class="intro-text">Sabemos que la duda que tienes ahora mismo no es solo de dinero: es si merece la pena empezar a moverse o esperar un poco más.</p>
    <p class="intro-text">En menos de un minuto te damos una primera orientación de coste, plazos y quién interviene — para que puedas pensar con algo más de terreno bajo los pies.</p>
    <ul class="intro-list">
      <li>6 preguntas sencillas sobre tu vivienda</li>
      <li>Un rango de inversión orientativo, no una cifra cerrada</li>
      <li>Tiempos y personas que suelen intervenir en un proceso así</li>
    </ul>
    <div class="nav" style="justify-content:flex-end;">
      <button class="btn btn-primary" id="start-btn">Empezar</button>
    </div>
  `;
  document.getElementById('start-btn').onclick = () => { step = 1; render(); };
}

function renderQuestion(){
  const q = questions[step-1];
  let inner = '';

  if(q.type === 'choice'){
    inner = `<div class="options">` + q.options.map(o => `
      <button class="option ${answers[q.key]===o.value?'selected':''}" data-value="${o.value}">
        <div class="option-label">${o.label}</div>
        <div class="option-hint">${o.hint}</div>
      </button>
    `).join('') + `</div>`;
    if(q.disclaimer){
      inner += `<div class="q-disclaimer">${q.disclaimer}</div>`;
    }
  } else if(q.type === 'slider'){
    const val = answers[q.key] ?? q.def;
    inner = `
      <div class="slider-wrap">
        <div class="slider-value" id="slider-display">${val} <span>${q.unit}</span></div>
        <input type="range" id="slider-input" min="${q.min}" max="${q.max}" step="${q.step}" value="${val}">
        <div class="slider-scale"><span>${q.min} ${q.unit}</span><span>${q.max}+ ${q.unit}</span></div>
      </div>
    `;
  }

  contentEl.innerHTML = `
    <div class="q-title">${q.title}</div>
    <p class="q-subtitle">${q.subtitle}</p>
    ${inner}
    <div class="nav">
      <button class="btn btn-ghost" id="back-btn">${step===1?'':'← Atrás'}</button>
      <button class="btn btn-primary" id="next-btn" ${answers[q.key]===undefined?'disabled':''}>
        ${step===questions.length ? 'Ver mi estimación' : 'Continuar'}
      </button>
    </div>
  `;

  if(q.type === 'choice'){
    contentEl.querySelectorAll('.option').forEach(btn => {
      btn.onclick = () => {
        answers[q.key] = btn.dataset.value;
        renderQuestion();
      };
    });
  } else {
    const slider = document.getElementById('slider-input');
    const display = document.getElementById('slider-display');
    answers[q.key] = parseInt(slider.value);
    slider.oninput = () => {
      answers[q.key] = parseInt(slider.value);
      display.innerHTML = `${slider.value} <span>${q.unit}</span>`;
      document.getElementById('next-btn').disabled = false;
    };
  }

  document.getElementById('back-btn').onclick = () => { if(step>1){ step--; render(); } };
  document.getElementById('next-btn').onclick = () => {
    if(answers[q.key] === undefined) return;
    if(step === questions.length){ step = 98; render(); triggerCalculation(); }
    else { step++; render(); }
  };
}

function triggerCalculation(){
  setTimeout(() => { step = 99; render(); }, 1300);
}

function renderCalculating(){
  contentEl.innerHTML = `
    <div class="calc-wrap">
      <div class="calc-stones">
        <div class="calc-dot"></div><div class="calc-dot"></div><div class="calc-dot"></div>
      </div>
      <div class="calc-text">Cruzando tus respuestas con rangos habituales del sector…</div>
    </div>
  `;
}

// --- Lógica de estimación ---
function calcCost(){
  const baseRanges = {
    esencial:[650,850],
    medio:[850,1150],
    alto:[1150,1600]
  };
  const scopeMultiplier = {
    integral:1, cocinaybanos:0.45, ampliacion:1.3, parcial:0.3
  };
  const surface = answers.superficie;

  // Caso especial: reforma integral con acabados medios → 1.000 €/m²
  if(answers.alcance === 'integral' && answers.acabados === 'medio'){
    const v = Math.round(surface*1000/500)*500;
    return {low:v, high:v, single:true};
  }

  const [lo,hi] = baseRanges[answers.acabados];
  const mult = scopeMultiplier[answers.alcance];
  const low = Math.round(surface*lo*mult/500)*500;
  const high = Math.round(surface*hi*mult/500)*500;
  return {low, high, single:false};
}

// Desglose: obra + IVA obra (10%) + honorarios técnicos (10% obra + 21% IVA) + tasas municipales (~4%)
function calcBreakdown(cost){
  const r100 = n => Math.round(n/100)*100;
  const line = base => ({
    obra: r100(base),
    ivaObra: r100(base*0.10),
    honorarios: r100(base*0.10*1.21),
    tasas: r100(base*0.04)
  });
  const lo = line(cost.low);
  const hi = line(cost.high);
  const totalLo = lo.obra + lo.ivaObra + lo.honorarios + lo.tasas;
  const totalHi = hi.obra + hi.ivaObra + hi.honorarios + hi.tasas;
  return {lo, hi, totalLo, totalHi, single:cost.single};
}

function calcTimeline(){
  const table = {
    integral:   { diseno:[4,8],  licencias:[6,12], obra:[14,20] },
    cocinaybanos:{ diseno:[3,5], licencias:[2,4],  obra:[6,10] },
    ampliacion: { diseno:[6,10], licencias:[8,14], obra:[18,26] },
    parcial:    { diseno:[2,4],  licencias:[1,3],  obra:[4,8] }
  };
  return table[answers.alcance];
}

function calcStakeholders(){
  const list = ['Arquitecto/a — dirección y coordinación del proyecto'];
  if(answers.alcance==='integral' || answers.alcance==='ampliacion'){
    list.push('Aparejador/a o dirección de ejecución de obra');
    list.push('Ayuntamiento — licencia de obra mayor');
  } else {
    list.push('Ayuntamiento — comunicado o licencia de obra menor');
  }
  list.push('Empresa constructora o contratista principal');
  list.push('Gremios — fontanería, electricidad, carpintería…');
  if(answers.eficiencia==='si' || answers.eficiencia==='interesa'){
    list.push('Técnico certificador energético — certificado antes y después de la obra');
  }
  if(answers.alcance==='ampliacion'){
    list.push('Comunidad de vecinos, si se tocan elementos comunes');
  }
  return list;
}

function fmt(n){ return n.toLocaleString('es-ES'); }

const scopeLabel = {integral:'una reforma integral', cocinaybanos:'una reforma de cocina y baños', ampliacion:'una ampliación o redistribución', parcial:'una reforma parcial'};
const finishLabel = {esencial:'acabados esenciales', medio:'acabados medios', alto:'acabados altos'};

function renderResult(){
  const cost = calcCost();
  const bd = calcBreakdown(cost);
  const time = calcTimeline();
  const people = calcStakeholders();
  const totalLow = time.diseno[0]+time.licencias[0]+time.obra[0];
  const totalHigh = time.diseno[1]+time.licencias[1]+time.obra[1];

  const val = (a,b) => bd.single ? `${fmt(a)} €` : `${fmt(a)} – ${fmt(b)} €`;

  const rangeHTML = bd.single
    ? `<div class="range-value">≈ ${fmt(bd.totalLo)} €</div>
       <div class="range-caption">Inversión total orientativa, con obra a 1.000 €/m² (obra + IVA + honorarios + tasas)</div>`
    : `<div class="range-value">${fmt(bd.totalLo)} € – ${fmt(bd.totalHi)} €</div>
       <div class="range-caption">Rango orientativo de inversión total (obra + IVA + honorarios + tasas)</div>`;

  const breakdownHTML = `
    <div class="section">
      <div class="section-title">De qué se compone esta cifra</div>
      <div class="phase-row"><span class="phase-name">Obra (ejecución de la reforma)</span><span class="phase-weeks">${val(bd.lo.obra, bd.hi.obra)}</span></div>
      <div class="phase-row"><span class="phase-name">IVA de la obra (10%)</span><span class="phase-weeks">${val(bd.lo.ivaObra, bd.hi.ivaObra)}</span></div>
      <div class="phase-row"><span class="phase-name">Honorarios técnicos, IVA incluido<br><small style="color:var(--ink-faint);font-weight:400;">Arquitecto/a, aparejador/a, estructurista, ingeniería…</small></span><span class="phase-weeks">${val(bd.lo.honorarios, bd.hi.honorarios)}</span></div>
      <div class="phase-row"><span class="phase-name">Tasas y licencias municipales<br><small style="color:var(--ink-faint);font-weight:400;">ICIO y tasa de licencia, según ayuntamiento</small></span><span class="phase-weeks">${val(bd.lo.tasas, bd.hi.tasas)}</span></div>
      <div class="phase-row"><span class="phase-name" style="font-weight:700;">Inversión total</span><span class="phase-weeks">${val(bd.totalLo, bd.totalHi)}</span></div>
    </div>`;

  const ecoHTML = (answers.eficiencia==='si' || answers.eficiencia==='interesa')
    ? `<div class="eco-box">Has mostrado interés en la eficiencia energética — buena decisión. Mejorar aislamiento, ventanas o climatización durante la reforma cuesta mucho menos que hacerlo después, reduce la factura mensual y puede abrir la puerta a ayudas públicas y deducciones fiscales por rehabilitación energética. Lo veremos con calma en tu caso concreto.</div>`
    : '';

  contentEl.innerHTML = `
    <div class="result-eyebrow">Tu estimación</div>
    <div class="result-title">Para ${answers.superficie} m² con ${scopeLabel[answers.alcance]} y ${finishLabel[answers.acabados]}:</div>

    <div class="range-box">
      ${rangeHTML}
    </div>

    ${breakdownHTML}

    ${ecoHTML}

    <div class="section">
      <div class="section-title">Tiempos aproximados</div>
      <div class="phase-row"><span class="phase-name">Diseño y proyecto</span><span class="phase-weeks">${time.diseno[0]}–${time.diseno[1]} sem.</span></div>
      <div class="phase-row"><span class="phase-name">Licencias y trámites</span><span class="phase-weeks">${time.licencias[0]}–${time.licencias[1]} sem.</span></div>
      <div class="phase-row"><span class="phase-name">Obra</span><span class="phase-weeks">${time.obra[0]}–${time.obra[1]} sem.</span></div>
      <div class="phase-row"><span class="phase-name" style="font-weight:700;">Total, de principio a fin</span><span class="phase-weeks">${totalLow}–${totalHigh} sem.</span></div>
    </div>

    <div class="section">
      <div class="section-title">Quién suele intervenir</div>
      <div class="people-list">
        ${people.map(p => `<div class="people-item">${p}</div>`).join('')}
      </div>
    </div>

    <div class="note">Estimación orientativa basada en rangos habituales del sector en España. El IVA de la obra se calcula al tipo reducido del 10% (aplicable a reformas de vivienda que cumplen ciertos requisitos; en otros casos es el 21%). Los honorarios técnicos se estiman en torno al 10% de la obra más su IVA (21%), y las tasas municipales alrededor del 4%, aunque varían según el ayuntamiento y el tipo de licencia. El coste real depende del estado previo de la vivienda y de las decisiones de proyecto — por eso el siguiente paso natural es un presupuesto hecho a medida.</div>

    <div class="cta">
      <div class="cta-title">¿Seguimos hablando de tu caso?</div>
      <div class="cta-text">No hace falta decidir nada hoy. Una primera conversación sirve para aterrizar esto a tu vivienda real.</div>
      <a href="mailto:info@tuestudio.com?subject=Quiero%20hablar%20sobre%20mi%20reforma" class="btn-cta">Reservar una primera conversación</a>
      <button class="btn-restart" id="restart-btn">Volver a empezar</button>
    </div>
  `;
  document.getElementById('restart-btn').onclick = () => {
    step = 0; render();
  };
}

function render(){
  renderProgress();
  if(step === 0) renderIntro();
  else if(step >= 1 && step <= questions.length) renderQuestion();
  else if(step === 98) renderCalculating();
  else if(step === 99) renderResult();
}

render();
</script>
</body>
</html>
